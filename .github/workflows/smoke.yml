name: smoke

# Manual check: load both models on the runner and forecast one asset.
# Writes nothing. It also fills the model cache that the nightly run reuses.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('duel/models.py') }}
          restore-keys: hf-
      - run: uv sync --frozen
      - run: uv run python -m duel smoke
